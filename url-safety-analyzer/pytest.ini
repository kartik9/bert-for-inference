[pytest]
# Pytest configuration for URL Safety Analyzer nightly tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra
    --cov=backend
    --cov-report=html
    --cov-report=term-missing

# Markers for different test categories
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit: marks unit tests
    network: marks tests that require network access
    ai: marks tests that use AI APIs
    nightly: marks tests to run in nightly builds
    smoke: marks smoke tests for quick validation

# Async support
asyncio_mode = auto

# Timeout for tests (5 minutes)
timeout = 300

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::urllib3.exceptions.InsecureRequestWarning
