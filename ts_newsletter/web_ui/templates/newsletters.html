{% extends "base.html" %}

{% block title %}Browse Newsletters - Trust & Safety{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="mb-4">
            <i class="bi bi-newspaper"></i>
            Browse Newsletters
        </h1>
    </div>
</div>

<!-- Filter Panel -->
<div class="filter-panel">
    <div class="row">
        <div class="col-md-3">
            <label class="form-label">Date Range</label>
            <select class="form-select" id="dateRange">
                <option value="all">All Time</option>
                <option value="30">Last 30 Days</option>
                <option value="90" selected>Last 90 Days</option>
                <option value="180">Last 6 Months</option>
                <option value="365">Last Year</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="statusFilter">
                <option value="all">All</option>
                <option value="completed">Completed</option>
                <option value="draft">Draft</option>
                <option value="approved">Approved</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Sort By</label>
            <select class="form-select" id="sortBy">
                <option value="date_desc">Date (Newest First)</option>
                <option value="date_asc">Date (Oldest First)</option>
                <option value="quality_desc">Quality Score (High to Low)</option>
                <option value="articles_desc">Article Count (High to Low)</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">&nbsp;</label>
            <button class="btn btn-primary w-100" onclick="applyFilters()">
                <i class="bi bi-funnel"></i> Apply Filters
            </button>
        </div>
    </div>
</div>

<!-- Newsletter Grid -->
<div class="row" id="newsletters-grid">
    <div class="col-12 text-center py-5">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3">Loading newsletters...</p>
    </div>
</div>

<!-- Pagination -->
<div class="row mt-4">
    <div class="col-12">
        <nav aria-label="Newsletter pagination">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination items will be inserted here -->
            </ul>
        </nav>
    </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
let newsletters = [];
let filteredNewsletters = [];
const itemsPerPage = 9;
let currentPage = 1;

async function loadNewsletters() {
    try {
        const response = await fetch('/api/newsletters');
        const data = await response.json();

        if (data.success) {
            newsletters = data.newsletters;
            filteredNewsletters = newsletters;
            displayNewsletters();
        }
    } catch (error) {
        console.error('Error loading newsletters:', error);
        document.getElementById('newsletters-grid').innerHTML = `
            <div class="col-12 text-center py-5">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                <p class="mt-3">Failed to load newsletters</p>
            </div>
        `;
    }
}

function applyFilters() {
    const dateRange = document.getElementById('dateRange').value;
    const statusFilter = document.getElementById('statusFilter').value;
    const sortBy = document.getElementById('sortBy').value;

    // Filter by date range
    let filtered = [...newsletters];

    if (dateRange !== 'all') {
        const daysAgo = parseInt(dateRange);
        const cutoffDate = new Date();
        cutoffDate.setDate(cutoffDate.getDate() - daysAgo);

        filtered = filtered.filter(nl => {
            const nlDate = new Date(nl.date);
            return nlDate >= cutoffDate;
        });
    }

    // Filter by status
    if (statusFilter !== 'all') {
        filtered = filtered.filter(nl => nl.status === statusFilter);
    }

    // Sort
    if (sortBy === 'date_desc') {
        filtered.sort((a, b) => b.date.localeCompare(a.date));
    } else if (sortBy === 'date_asc') {
        filtered.sort((a, b) => a.date.localeCompare(b.date));
    } else if (sortBy === 'quality_desc') {
        filtered.sort((a, b) => (b.metrics.quality_score || 0) - (a.metrics.quality_score || 0));
    } else if (sortBy === 'articles_desc') {
        filtered.sort((a, b) => (b.metrics.articles_collected || 0) - (a.metrics.articles_collected || 0));
    }

    filteredNewsletters = filtered;
    currentPage = 1;
    displayNewsletters();
}

function displayNewsletters() {
    const grid = document.getElementById('newsletters-grid');

    if (filteredNewsletters.length === 0) {
        grid.innerHTML = `
            <div class="col-12 text-center py-5">
                <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                <p class="mt-3">No newsletters found</p>
            </div>
        `;
        return;
    }

    // Pagination
    const startIdx = (currentPage - 1) * itemsPerPage;
    const endIdx = startIdx + itemsPerPage;
    const pageNewsletters = filteredNewsletters.slice(startIdx, endIdx);

    // Display cards
    grid.innerHTML = pageNewsletters.map(nl => createNewsletterCard(nl)).join('');

    // Update pagination
    updatePagination();
}

function createNewsletterCard(nl) {
    const qualityScore = nl.metrics.quality_score || 0;
    const articlesCount = nl.metrics.articles_collected || 0;

    return `
        <div class="col-md-4 mb-4">
            <div class="card newsletter-preview h-100">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="bi bi-calendar3"></i>
                        ${formatDate(nl.date)}
                    </h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <span class="badge ${getStatusBadgeClass(nl.status)}">
                            ${nl.status}
                        </span>
                        <span class="badge ${getQualityBadgeClass(qualityScore)}">
                            Quality: ${qualityScore.toFixed(1)}/10
                        </span>
                    </div>

                    <p class="card-text">
                        <i class="bi bi-file-text"></i> ${articlesCount} articles<br>
                        <i class="bi bi-file-earmark"></i> ${formatFileSize(nl.size)}<br>
                        <i class="bi bi-clock"></i> ${formatDateTime(nl.created)}
                    </p>
                </div>
                <div class="card-footer">
                    <a href="/newsletter/${nl.id}" class="btn btn-primary btn-sm">
                        <i class="bi bi-eye"></i> View
                    </a>
                    <a href="/api/newsletters/${nl.id}/download" class="btn btn-secondary btn-sm">
                        <i class="bi bi-download"></i> Download
                    </a>
                </div>
            </div>
        </div>
    `;
}

function updatePagination() {
    const totalPages = Math.ceil(filteredNewsletters.length / itemsPerPage);
    const pagination = document.getElementById('pagination');

    if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }

    let html = '';

    // Previous button
    html += `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">Previous</a>
        </li>
    `;

    // Page numbers
    for (let i = 1; i <= totalPages; i++) {
        html += `
            <li class="page-item ${i === currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
            </li>
        `;
    }

    // Next button
    html += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">Next</a>
        </li>
    `;

    pagination.innerHTML = html;
}

function changePage(page) {
    const totalPages = Math.ceil(filteredNewsletters.length / itemsPerPage);

    if (page < 1 || page > totalPages) return;

    currentPage = page;
    displayNewsletters();

    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Load on page load
document.addEventListener('DOMContentLoaded', loadNewsletters);
</script>
{% endblock %}
