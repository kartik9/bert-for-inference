name: URL Safety Analyzer - Nightly Tests

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
      - claude/aurora-nightly-tests-*
    paths:
      - 'url-safety-analyzer/**'
      - '.github/workflows/nightly-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('url-safety-analyzer/backend/requirements.txt', 'url-safety-analyzer/test-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd url-safety-analyzer
          pip install -r backend/requirements.txt
          pip install -r test-requirements.txt

      - name: Run unit tests
        run: |
          cd url-safety-analyzer
          pytest tests/ -v -m "unit and nightly" --tb=short --maxfail=5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-mock-key' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test-mock-key' }}

      - name: Run integration tests
        run: |
          cd url-safety-analyzer
          pytest tests/ -v -m "integration and nightly" --tb=short --maxfail=3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-mock-key' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test-mock-key' }}

      - name: Run smoke tests
        run: |
          cd url-safety-analyzer
          pytest tests/ -v -m "smoke" --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-mock-key' }}

      - name: Generate coverage report
        if: matrix.python-version == '3.11'
        run: |
          cd url-safety-analyzer
          pytest tests/ --cov=backend --cov-report=xml --cov-report=html -m "nightly"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-mock-key' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test-mock-key' }}

      - name: Upload coverage reports
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: url-safety-analyzer/htmlcov/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: url-safety-analyzer/test-results/
          retention-days: 30

  network-tests:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd url-safety-analyzer
          pip install -r backend/requirements.txt
          pip install -r test-requirements.txt

      - name: Run network-dependent tests
        run: |
          cd url-safety-analyzer
          pytest tests/ -v -m "network and nightly" --tb=short --maxfail=5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-mock-key' }}
        continue-on-error: true  # Network tests may fail due to external factors

  performance-tests:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd url-safety-analyzer
          pip install -r backend/requirements.txt
          pip install -r test-requirements.txt

      - name: Run slow/performance tests
        run: |
          cd url-safety-analyzer
          pytest tests/ -v -m "slow and nightly" --tb=short --durations=10
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-mock-key' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test-mock-key' }}
        timeout-minutes: 30

  notification:
    runs-on: ubuntu-latest
    needs: [test, network-tests, performance-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Test suite completed"
          echo "Core tests: ${{ needs.test.result }}"
          echo "Network tests: ${{ needs.network-tests.result }}"
          echo "Performance tests: ${{ needs.performance-tests.result }}"

      - name: Send notification on failure
        if: needs.test.result == 'failure'
        run: |
          echo "::error::Nightly tests failed! Check the workflow logs for details."
